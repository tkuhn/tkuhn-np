{{- /*
  The bar at the top of every page: the site's name on the left, with the accent
  band behind it, and the sections on the right. The name is params.brand, else
  the site title.
*/ -}}
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}"><span class="hl">{{ site.Params.brand | default site.Title }}</span></a>
    {{ partial "nav.html" . }}
  </div>
</header>
