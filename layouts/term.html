{{ define "main" }}
  <section class="band band--brown band--page">
    <div class="container">
      {{ with .Parent }}<p class="crumb"><a href="{{ .RelPermalink }}">← {{ .Title }}</a></p>{{ end }}
      <div class="section-head"><h1><span class="hl">{{ .Title }}</span></h1></div>
      <ul class="rows">
        {{- range .Pages.ByDate.Reverse }}{{ partial "item.html" (dict "page" .) }}{{ end }}
      </ul>
    </div>
  </section>
{{ end }}
