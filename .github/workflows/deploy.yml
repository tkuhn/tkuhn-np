name: Deploy

on:
  push:
    branches: [ main ]
  # New nanopublications appear without a commit, so rebuild on a timer too.
  # The getresource cache is set to maxAge = '24h' in hugo.toml, which is what
  # makes a daily run actually re-ask the endpoint rather than serve the cache.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. cancel-in-progress is false because cancelling a
# half-finished deploy is worse than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go is needed because the theme is consumed as a Hugo module.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # `extended`, not plain: the plain build cannot do image processing.
      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        run: |
          set -euo pipefail
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -o "${RUNNER_TEMP}/${deb}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          sudo dpkg -i "${RUNNER_TEMP}/${deb}"
          hugo version

      - name: Restore Hugo cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ github.run_id }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ hashFiles('go.mod') }}-
            hugo-${{ runner.os }}-

      - uses: actions/configure-pages@v5

      - name: Build
        run: hugo --minify --gc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
